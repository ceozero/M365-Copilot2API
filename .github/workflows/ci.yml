name: CI
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Build console
        working-directory: webapp
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: gofmt -l .
        shell: bash
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...